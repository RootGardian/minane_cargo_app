# ==============================================================================
# MINANE CARGO — Render Blueprint (Déploiement Automatisé Tout-en-Un)
# Conteneur Unique : Frontend Vite + Backend Express + PostgreSQL Embarqué
# 100% Gratuit sur Render (Ne nécessite aucun service de base de données externe)
# ==============================================================================
version: "1"

services:
  # ─── Service Web Unique Tout-en-Un (Front + Back + Base de Données) ───────────
  - type: web
    name: minane-cargo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@minanecargo.sn
      - key: ADMIN_PASSWORD
        value: AdminMinane2026!
      - key: ADMIN_NAME
        value: Gestionnaire Minane Cargo
