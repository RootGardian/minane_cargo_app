# ==============================================================================
# MINANE CARGO — Configuration Nginx Reverse Proxy
# Route le trafic entrant vers le conteneur 'minane_app' via le réseau Docker
# ==============================================================================

upstream minane_frontend_upstream {
    # Utilise le nom DNS du conteneur Docker applicatif (Frontend + Backend)
    server minane_app:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Sécurité & Masquage de version
    server_tokens off;
    client_max_body_size 50M;

    # Compression gzip pour optimiser la distribution des bundles Vite (React SPA)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # En-têtes de sécurité recommandés
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Redirection vers le conteneur front/back
    location / {
        proxy_pass http://minane_frontend_upstream;
        proxy_http_version 1.1;

        # Prise en charge des WebSockets et du rechargement à chaud
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Propagation des adresses IP et de l'hôte
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Gestion des tampons
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Délais d'expiration
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Healthcheck direct pour monitoring
    location /health {
        access_log off;
        return 200 "nginx ok\n";
    }
}

