services:
  minane-cargo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minane_cargo
    restart: always
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - APP_URL=https://minane-cargo-app.blackcoretech.duckdns.org
      - VIRTUAL_HOST=${VIRTUAL_HOST:-minane-cargo-app.blackcoretech.duckdns.org}
      - VIRTUAL_PORT=5000
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST:-minane-cargo-app.blackcoretech.duckdns.org}
      - JWT_SECRET=${JWT_SECRET:-minane_secret_jwt_key_2026_odhbilunnlqbheçtumbqnqçuib}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@minanecargo.sn}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminMinane2026!}
      - ADMIN_NAME=${ADMIN_NAME:-Gestionnaire Minane Cargo}
    volumes:
      - minane_postgres_data:/var/lib/postgresql/data
    networks:
      - default
      - proxy-net

volumes:
  minane_postgres_data:
    driver: local

networks:
  proxy-net:
    external: true
