# ==============================================================================
# MINANE CARGO — Docker Compose Production (Nginx + Application + PostgreSQL)
# Nginx route automatiquement le trafic vers le conteneur applicatif 'minane_app'
# ==============================================================================
version: '3.8'

services:
  # ─── 1. Reverse Proxy Nginx (Point d'entrée HTTP 80 & HTTPS 443) ─────────────
  nginx:
    image: nginx:alpine
    container_name: minane_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - minane-app
    networks:
      - minane_network

  # ─── 2. Conteneur Front/Back/BDD (Nom DNS interne : minane_app) ─────────────
  minane-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minane_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-minane_secret_jwt_key_2026_change_in_production_xyz123}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@minanecargo.sn}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminMinane2026!}
      - ADMIN_NAME=${ADMIN_NAME:-Gestionnaire Minane Cargo}
    volumes:
      # Persistance des données PostgreSQL sur le disque hôte
      - minane_postgres_data:/var/lib/postgresql/data
    networks:
      - minane_network

volumes:
  minane_postgres_data:
    driver: local

networks:
  minane_network:
    driver: bridge
